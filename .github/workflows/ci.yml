name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" || pip install -e . && pip install pytest
      - run: pytest -q
      - run: python -m py_compile src/agentproof/*.py

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f LICENSE && grep -q "Apache License" LICENSE && echo "LICENSE ok"
      - run: test -f citation.cff && echo "citation.cff ok"
